name: Merge main -> develop after pull request merge

on:
  pull_request:
    types: [ closed ]
    branches: [ main ]

jobs:
  merge_main_into_develop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "SymBnb CI"
          git config user.email "ci@symbnb.fr"

      - name: Merge main ➜ develop
        run: |
          git fetch origin 
          if git show-ref --quiet refs/remotes/origin/develop; then
            git checkout develop
            git merge origin/main --no-edit
            git push origin develop
          else
            echo "Branche develop inexistante — skip"
          fi
