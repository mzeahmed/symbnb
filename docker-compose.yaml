services:

  nginx:
    image: nginx:1.25-alpine
    container_name: symbnb_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      php:
        condition: service_started
    networks:
      - symbnb

  php:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: symbnb_php
    volumes:
      - .:/var/www
    working_dir: /var/www
    depends_on:
      - database
      - redis
    networks:
      - symbnb

  ###> doctrine/doctrine-bundle ###
  database:
    image: mysql:${MYSQL_VERSION:-8.0}
    container_name: symbnb_database
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      # You should definitely change the password in production
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-app}", "-p${MYSQL_PASSWORD:-password}" ]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/mysql:rw
    networks:
      - symbnb
  ###< doctrine/doctrine-bundle ###

  redis:
    image: redis:7-alpine
    container_name: symbnb_redis
    ports:
      - "6379:6379"
    networks:
      - symbnb

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: symbnb_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
    depends_on:
      - database
    networks:
      - symbnb

networks:
  symbnb:
    driver: bridge

volumes:
  ###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
